spring.application.name=huza-backend

# Server Configuration (Railway Dynamic Port)
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hikari Connection Pool Tuning (Prevents connection drops on Railway)
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security / OAuth2 (Uses Railway's dynamic public domain)
spring.security.oauth2.client.registration.google.redirect-uri=https://${RAILWAY_PUBLIC_DOMAIN:huza-be-production.up.railway.app}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Application & Security Properties
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.verification.token.expiration=3600000

security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true