spring:
  application:
    name: huza-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/huza}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update # Preserves your data on restarts!
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:local@example.com}
    password: ${GMAIL_PASSWORD:local-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    user:
      name: admin
      password: admin

server:
  port: ${APP_PORT:8010}

app:
  frontend:
    url: http://localhost:3000
  verification:
    token:
      expiration: 86400000
  otp:
    expiration: 600000
    length: 6

logging:
  level:
    com.huza.huzabackend: DEBUG # Updated to scan your actual package
    org.springframework.mail: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/huza-auth-service.log

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: none
  show-actuator: false
  packages-to-scan: com.huza.huzabackend # Fixed package path so controller operations appear!
  paths-to-match: /api/**

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
    expiration-time: 3600000